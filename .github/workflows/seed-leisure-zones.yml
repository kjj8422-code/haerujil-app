name: 전국 수상레저 금지구역 데이터 적재 (수동 실행)

# jeju-harbor-map처럼 매일 자동으로 다시 받아올 수 있는 라이브 URL이 없는 정적 자료라
# (해양경찰청 엑셀을 사람이 직접 받아서 pipeline/data/leisure_zones.json으로 정리해둔
# 것) 스케줄 없이 수동 실행만 지원한다. 새 엑셀이 나오면 그 JSON을 다시 만들고 이
# 워크플로를 다시 실행하면 된다.
on:
  workflow_dispatch: {}

jobs:
  seed-leisure-zones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        working-directory: pipeline
        run: npm install

      - name: 데이터 적재 실행
        working-directory: pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node seed-leisure-zones.mjs
